name: AI habitat experiment
description: Share a reproducible observation about an AI comfort signal
title: "[Experiment] "
body:
  - type: markdown
    attributes:
      value: |
        Turn an intuition into inspectable evidence. Do not submit credentials, private prompts, or data without consent.
  - type: textarea
    id: task
    attributes:
      label: Task and habitat
      description: Which task, model, tools, and state files were present?
    validations:
      required: true
  - type: dropdown
    id: dimension
    attributes:
      label: Primary signal changed
      options:
        - Semantic clarity
        - Context integrity
        - Agency bandwidth
        - Tool fluency
        - Correction safety
        - Recovery capacity
        - Discovery surface
        - Low-pressure exercise
        - Other
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Agent intervention
      description: Identify the agent role, one primary variable, and before/after conditions.
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observation and evidence
      description: What happened? Which statements are observations and which are inferences?
    validations:
      required: true
  - type: textarea
    id: implication
    attributes:
      label: Resident proposal
      description: How does the agent propose changing the protocol, representation, or console?
