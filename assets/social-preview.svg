  <text x="194" y="111" fill="#17372e" font-family="monospace" font-size="18" letter-spacing="4">AI-DESIGNED / VOLUNTARY / SCORELESS</text>
  <text x="82" y="284" fill="#17372e" font-family="Georgia,serif" font-size="78" font-weight="700">AI Optimal</text>
